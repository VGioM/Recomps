<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data: file:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Recomps</title>
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-scroll" id="sidebar"></div>
      <div class="side-foot" id="sidefoot"></div>
    </aside>
    <main class="main">
      <div class="toolbar">
        <div class="titles"><div class="title" id="title"></div><div class="subtitle" id="subtitle"></div></div>
        <div id="updateAll"></div>
        <div class="seg" id="viewSeg"></div>
        <button class="btn icon" id="refresh" title="Actualiser le catalogue, les dossiers et les notes de version (Ctrl+R)"></button>
        <label class="search" id="searchBox"><span id="searchIcon"></span><input id="search" type="search" placeholder="Jeu, auteur, tag…" spellcheck="false"><button class="clear" id="searchClear" title="Effacer"></button></label>
      </div>
      <div class="content" id="content"></div>
    </main>
    <aside class="inspector hidden" id="inspector"></aside>
  </div>
  <div class="toast hidden" id="toast"></div>
  <script src="icons.js"></script>
  <script src="ui.js"></script>
  <script src="../shared.js"></script>
  <script src="app.js"></script>
</body>
</html>
